apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamo-nats-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dynamo-nats-server
  template:
    metadata:
      labels:
        app: dynamo-nats-server
    spec:
      containers:
      - name: nats
        image: nats:2.11.4
        args:
          - "-js"
          - "--trace"
          - "-m"
          - "8222"
        ports:
          - containerPort: 4222
          - containerPort: 6222
          - containerPort: 8222
---
apiVersion: v1
kind: Service
metadata:
  name: dynamo-nats-server
spec:
  selector:
    app: dynamo-nats-server
  ports:
    - name: client
      port: 4222
      targetPort: 4222
    - name: cluster
      port: 6222
      targetPort: 6222
    - name: monitoring
      port: 8222
      targetPort: 8222
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dynamo-etcd-server
spec:
  serviceName: dynamo-etcd-server
  replicas: 1
  selector:
    matchLabels:
      app: dynamo-etcd-server
  template:
    metadata:
      labels:
        app: dynamo-etcd-server
    spec:
      containers:
      - name: etcd
        image: bitnamilegacy/etcd:3.6.1
        env:
          - name: ALLOW_NONE_AUTHENTICATION
            value: "yes"
        ports:
          - containerPort: 2379
          - containerPort: 2380
---
apiVersion: v1
kind: Service
metadata:
  name: dynamo-etcd-server
spec:
  selector:
    app: dynamo-etcd-server
  ports:
    - name: client
      port: 2379
      targetPort: 2379
    - name: peer
      port: 2380
      targetPort: 2380
  type: ClusterIP
